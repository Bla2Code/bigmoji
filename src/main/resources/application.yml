spring:
  application:
    name: bigmoji
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/bigmoji}
    username: ${POSTGRES_USER:bigmoji}
    password: ${POSTGRES_PASSWORD:bigmoji}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

bigmoji:
  api-key: ${API_KEY:dev-api-key}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
    bucket-prefix: ${MINIO_BUCKET_PREFIX:bigmoji-}
  discord:
    token: ${DISCORD_TOKEN:}
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:10}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info
